# IDJÔ CV — Nginx en façade du serveur Next, sur un VPS Hostinger.
#
# Installation :
#   sudo cp deploiement/hostinger/nginx-idjo-cv.conf /etc/nginx/sites-available/idjo-cv
#   sudo ln -s /etc/nginx/sites-available/idjo-cv /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le certificat HTTPS s'obtient ensuite avec :
#   sudo certbot --nginx -d idjocv.ci -d www.idjocv.ci
# Certbot réécrit ce fichier pour y ajouter le bloc 443 et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name idjocv.ci www.idjocv.ci;

    # Journaux séparés : utile pour distinguer ce site des autres du VPS.
    access_log /var/log/nginx/idjo-cv.access.log;
    error_log  /var/log/nginx/idjo-cv.error.log;

    # Un CV importé peut peser lourd (PDF, photo en data URL) : la limite par
    # défaut de 1 Mo refuserait l'envoi.
    client_max_body_size 12M;

    # Les en-têtes de sécurité sont posés par Next (voir next.config.mjs) ;
    # Nginx ne les duplique pas pour éviter les valeurs contradictoires.

    # Fichiers versionnés par Next : leur nom change à chaque build, on peut
    # les garder en cache un an.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # La fabrication d'un PDF et l'appel à l'assistant peuvent dépasser la
        # minute par défaut.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
